<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1d2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a2f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2118;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1e3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#210d21;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f0a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1200;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4fc3f7" opacity="0.8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399" opacity="0.8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="60" x2="900" y2="60"/><line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/><line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="300" x2="900" y2="300"/><line x1="0" y1="360" x2="900" y2="360"/>
    <line x1="0" y1="420" x2="900" y2="420"/><line x1="0" y1="480" x2="900" y2="480"/>
    <line x1="0" y1="540" x2="900" y2="540"/>
    <line x1="90" y1="0" x2="90" y2="600"/><line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="270" y1="0" x2="270" y2="600"/><line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/><line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="630" y1="0" x2="630" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="810" y1="0" x2="810" y2="600"/>
  </g>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="url(#titleGrad)" letter-spacing="1">czcode — 终端 AI Agent</text>
  <text x="450" y="58" text-anchor="middle" font-size="10" fill="#6b7280" letter-spacing="2">THREE SCENARIOS · ONE TOOL · SWITCH WITH TAB</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- CENTER CORE BOX -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="330" y="230" width="240" height="118" rx="10" fill="url(#coreGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="330" y="230" width="240" height="118" rx="10" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;5;2" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">⚡ czcode</text>
  <text x="450" y="277" text-anchor="middle" font-size="10" fill="#9ca3af">TUI Terminal Agent</text>
  <rect x="345" y="287" width="58" height="17" rx="4" fill="#292524" stroke="#78716c" stroke-width="0.8"/>
  <text x="374" y="299" text-anchor="middle" font-size="9" fill="#a8a29e">Qwen</text>
  <rect x="411" y="287" width="58" height="17" rx="4" fill="#292524" stroke="#78716c" stroke-width="0.8"/>
  <text x="440" y="299" text-anchor="middle" font-size="9" fill="#a8a29e">Claude</text>
  <rect x="477" y="287" width="58" height="17" rx="4" fill="#292524" stroke="#78716c" stroke-width="0.8"/>
  <text x="506" y="299" text-anchor="middle" font-size="9" fill="#a8a29e">OpenAI</text>
  <text x="450" y="330" text-anchor="middle" font-size="9.5" fill="#6b7280">Skills · Roles · Tools</text>

  <!-- TAB SWITCH BANNER — prominent, above center box -->
  <rect x="310" y="196" width="280" height="26" rx="6" fill="#1c1a00" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="450" y="213" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fbbf24">
    ⌨ Tab 循环切换角色 · 或输入 /cz_role
  </text>
  <!-- animated glow on tab banner -->
  <rect x="310" y="196" width="280" height="26" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- LEFT: Scenario 1 — Lakehouse Data Work -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="28" y="120" width="238" height="340" rx="10" fill="url(#lhGrad)" stroke="#4fc3f7" stroke-width="1.2" filter="url(#softShadow)"/>

  <text x="147" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#4fc3f7" filter="url(#glowBlue)">场景一</text>
  <text x="147" y="163" text-anchor="middle" font-size="10.5" fill="#93c5fd">Lakehouse 数据工作</text>

  <!-- 5 data roles + ask, 3 rows of 2 -->
  <g font-size="9" fill="#bfdbfe">
    <!-- row 1 -->
    <rect x="40" y="174" width="96" height="19" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="88" y="187" text-anchor="middle">数据分析师 (默认)</text>
    <rect x="144" y="174" width="96" height="19" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="192" y="187" text-anchor="middle">数据工程师</text>
    <!-- row 2 -->
    <rect x="40" y="199" width="96" height="19" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="88" y="212" text-anchor="middle">数据科学家</text>
    <rect x="144" y="199" width="96" height="19" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="192" y="212" text-anchor="middle">数据运维</text>
    <!-- row 3 -->
    <rect x="40" y="224" width="96" height="19" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="88" y="237" text-anchor="middle">数据治理</text>
    <rect x="144" y="224" width="96" height="19" rx="4" fill="#0f2a1a" stroke="#059669" stroke-width="0.8"/>
    <text x="192" y="237" fill="#6ee7b7" text-anchor="middle">ask (问答)</text>
  </g>

  <line x1="44" y1="252" x2="252" y2="252" stroke="#1e40af" stroke-width="0.8" stroke-dasharray="4,3"/>

  <g font-size="9.5" fill="#93c5fd">
    <text x="44" y="269">▸ 自然语言 → SQL 执行</text>
    <text x="44" y="287">▸ 数仓建模 / DDL 生成</text>
    <text x="44" y="305">▸ /cz_sample  /cz_profile  /cz_count</text>
    <text x="44" y="323">▸ VCluster 运维管理</text>
    <text x="44" y="341">▸ 危险操作安全确认</text>
  </g>

  <rect x="40" y="356" width="210" height="88" rx="6" fill="#0d2137" stroke="#1d4ed8" stroke-width="0.8"/>
  <text x="145" y="373" text-anchor="middle" font-size="9" fill="#60a5fa">ClickZetta Lakehouse</text>
  <g font-size="8.5" fill="#475569" text-anchor="middle">
    <text x="82" y="391">SQL / DDL</text>
    <text x="145" y="391">VCluster</text>
    <text x="208" y="391">RBAC</text>
    <text x="82" y="408">31 Skills</text>
    <text x="145" y="408">MCP Tools</text>
    <text x="208" y="408">监控告警</text>
    <text x="145" y="425" fill="#374151" font-size="8">ask 角色可使用 Skills 知识库</text>
  </g>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- BOTTOM CENTER: Scenario 2 — App Dev -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="330" y="376" width="240" height="200" rx="10" fill="url(#codeGrad)" stroke="#34d399" stroke-width="1.2" filter="url(#softShadow)"/>

  <text x="450" y="401" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399" filter="url(#glowGreen)">场景二</text>
  <text x="450" y="417" text-anchor="middle" font-size="10.5" fill="#6ee7b7">Lakehouse 应用开发</text>
  <line x1="348" y1="425" x2="552" y2="425" stroke="#065f46" stroke-width="0.8" stroke-dasharray="4,3"/>

  <g font-size="9" fill="#6ee7b7">
    <text x="348" y="441">▸ SQL 任务开发 · 复杂查询 · 调度脚本</text>
    <text x="348" y="457">▸ Streamlit 看板 · dbt 模型 · Jupyter</text>
    <text x="348" y="473">▸ Python SDK · BulkLoad 批量写入</text>
    <text x="348" y="489">▸ Java SDK · Kafka 实时写入</text>
    <text x="348" y="505">▸ Spark / Flink Connector</text>
    <text x="348" y="521">▸ Dynamic Table 数据管道</text>
  </g>

  <rect x="348" y="532" width="204" height="30" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
  <text x="450" y="545" text-anchor="middle" font-size="9" fill="#34d399">Code / Plan 角色</text>
  <text x="450" y="558" text-anchor="middle" font-size="9" fill="#059669">+ Lakehouse Skills 自动注入</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- RIGHT: Scenario 3 — General Dev -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="634" y="120" width="238" height="340" rx="10" fill="url(#devGrad)" stroke="#a78bfa" stroke-width="1.2" filter="url(#softShadow)"/>

  <text x="753" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa" filter="url(#glowPurple)">场景三</text>
  <text x="753" y="163" text-anchor="middle" font-size="10.5" fill="#c4b5fd">通用软件开发</text>

  <g font-size="9.5" fill="#ddd6fe">
    <rect x="648" y="174" width="60" height="19" rx="4" fill="#3b1f6e" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="678" y="187" text-anchor="middle">code</text>
    <rect x="716" y="174" width="60" height="19" rx="4" fill="#3b1f6e" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="746" y="187" text-anchor="middle">plan</text>
    <rect x="784" y="174" width="60" height="19" rx="4" fill="#3b1f6e" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="814" y="187" text-anchor="middle">debug</text>
  </g>

  <line x1="648" y1="202" x2="858" y2="202" stroke="#4c1d95" stroke-width="0.8" stroke-dasharray="4,3"/>

  <g font-size="9.5" fill="#c4b5fd">
    <text x="648" y="220">▸ Python / Java / Go / Rust</text>
    <text x="648" y="238">▸ TypeScript / React</text>
    <text x="648" y="256">▸ 代码生成与重构</text>
    <text x="648" y="274">▸ Bug 分析与修复</text>
    <text x="648" y="292">▸ 架构设计规划</text>
    <text x="648" y="310">▸ 文件读写 / 命令执行</text>
    <text x="648" y="328">▸ Git 操作 / 测试运行</text>
  </g>

  <rect x="648" y="342" width="198" height="20" rx="4" fill="#2e1065" stroke="#6d28d9" stroke-width="0.8"/>
  <text x="747" y="356" text-anchor="middle" font-size="9" fill="#a78bfa">继承自 KiloCode / OpenCode</text>

  <rect x="648" y="368" width="198" height="76" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
  <text x="747" y="385" text-anchor="middle" font-size="9" fill="#818cf8">任意项目目录下运行</text>
  <text x="747" y="401" text-anchor="middle" font-size="9" fill="#6366f1">无需 Lakehouse 连接</text>
  <line x1="660" y1="410" x2="834" y2="410" stroke="#312e81" stroke-width="0.6" stroke-dasharray="3,2"/>
  <text x="747" y="425" text-anchor="middle" font-size="8.5" fill="#4338ca">ask 角色：快速问答</text>
  <text x="747" y="438" text-anchor="middle" font-size="8.5" fill="#4338ca">不执行工具，仅对话</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- ANIMATED ARROWS -->
  <!-- ══════════════════════════════════════════════════════ -->
  <!-- Left → Center -->
  <line x1="266" y1="289" x2="326" y2="289" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- Center → Bottom -->
  <line x1="450" y1="372" x2="450" y2="348" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- Right → Center -->
  <line x1="634" y1="289" x2="574" y2="289" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowPurple)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <!-- Tab banner → center box connector lines -->
  <line x1="380" y1="222" x2="360" y2="230" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.4"/>
  <line x1="520" y1="222" x2="540" y2="230" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.4"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- FOOTER -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text x="450" y="582" text-anchor="middle" font-size="9" fill="#374151">
    github.com/yunqiqiliang/czcode · MIT License · fork of KiloCode → OpenCode
  </text>

  <!-- Corner dots -->
  <circle cx="20" cy="20" r="3" fill="#4fc3f7" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="20" r="3" fill="#a78bfa" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="580" r="3" fill="#34d399" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="580" r="3" fill="#fbbf24" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>
